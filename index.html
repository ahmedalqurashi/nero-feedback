<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback - Nero x Andorra Village</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            height: 100%;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            background-attachment: fixed;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: transparent;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(255, 51, 102, 0.2);
            padding: 50px 40px;
            max-width: 500px;
            width: 100%;
            animation: fadeIn 0.5s ease-in;
            border: 1px solid rgba(255, 51, 102, 0.1);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin: 0 auto 35px;
            padding: 10px 0;
            width: fit-content;
        }

        .logo {
            height: 80px;
            width: auto;
            object-fit: contain;
            display: block;
        }

        .logo-separator {
            color: #1a1a1a;
            font-size: 24px;
            font-weight: 400;
            opacity: 0.7;
            line-height: 1;
            display: flex;
            align-items: center;
        }

        h1 {
            color: #FF3366;
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 12px;
            text-align: center;
        }

        .subtitle {
            color: #6b7280;
            font-size: 16px;
            text-align: center;
            margin-bottom: 40px;
        }

        .form-group {
            margin-bottom: 30px;
        }

        label {
            display: block;
            color: #374151;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 10px;
        }

        textarea {
            width: 100%;
            padding: 16px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 16px;
            font-family: inherit;
            resize: vertical;
            min-height: 150px;
            transition: all 0.3s ease;
            outline: none;
        }

        textarea:focus {
            border-color: #FF3366;
            box-shadow: 0 0 0 3px rgba(255, 51, 102, 0.1);
        }

        textarea::placeholder {
            color: #9ca3af;
        }

        .button {
            width: 100%;
            background: #e61454;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 51, 102, 0.3);
        }

        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 51, 102, 0.5);
            background: #FF3366;
        }

        .button:active {
            transform: translateY(0);
        }

        .button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .success-message {
            display: none;
            background: #fff0f5;
            border: 2px solid #FF3366;
            color: #FF3366;
            padding: 16px;
            border-radius: 12px;
            text-align: center;
            margin-top: 20px;
            font-weight: 500;
            animation: slideIn 0.3s ease-in;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .success-message.show {
            display: block;
        }

        .char-count {
            text-align: right;
            font-size: 12px;
            color: #9ca3af;
            margin-top: 8px;
        }

        .question-box {
            margin-bottom: 40px;
            text-align: center;
        }

        .feedback-section {
            margin-top: 40px;
            padding-top: 40px;
            border-top: 1px solid #e5e7eb;
        }

        .optional-label {
            display: inline-block;
            background: #FF3366;
            color: white;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 6px 14px;
            border-radius: 20px;
            margin-bottom: 16px;
        }

        .feedback-section {
            text-align: center;
        }

        .feedback-section form {
            text-align: left;
        }

        .question-label {
            display: inline-block;
            color: #FF3366;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 12px;
        }

        .question-title {
            color: #1a1a1a;
            font-size: 18px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 24px;
            line-height: 1.6;
        }

        .options-container {
            display: flex;
            gap: 15px;
            width: 100%;
        }

        .option-box {
            flex: 1;
            padding: 5px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            background: #ffffff;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            font-size: 16px;
            font-weight: 500;
            color: #6b7280;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            -webkit-tap-highlight-color: transparent;
        }

        .option-box img {
            width: 100px;
            height: 100px;
            object-fit: contain;
            transition: transform 0.3s ease;
            border: none;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        .option-box:hover img {
            transform: scale(1.1);
        }

        .option-box:hover {
            border-color: #FF3366;
        }

        .option-box.selected {
            border-color: #FF3366;
        }

        .option-box:active {
            border-color: #FF3366;
        }

        .option-text {
            position: relative;
            z-index: 1;
        }

        @media (max-width: 480px) {
            body {
                padding: 15px;
            }

            .container {
                padding: 35px 25px;
            }

            .logo-container {
                gap: 12px;
                margin-bottom: 25px;
            }

            .logo {
                height: 60px;
            }

            .logo-separator {
                font-size: 18px;
            }

            h1 {
                font-size: 24px;
                margin-bottom: 20px;
            }

            textarea {
                min-height: 120px;
                padding: 14px;
                font-size: 16px;
            }

            .button {
                padding: 14px;
                font-size: 16px;
            }

            .form-group {
                margin-bottom: 20px;
            }

            .option-box {
                padding: 5px;
            }

            .option-box img {
                width: 85px;
                height: 85px;
            }

            .question-box {
                margin-bottom: 30px;
            }

            .feedback-section {
                margin-top: 30px;
                padding-top: 25px;
            }

            .optional-label {
                font-size: 9px;
                padding: 5px 12px;
                margin-bottom: 12px;
            }

            .question-label {
                font-size: 10px;
                margin-bottom: 10px;
            }

            .question-title {
                font-size: 15px;
                margin-bottom: 18px;
            }

            .options-container {
                gap: 10px;
            }

            .option-box {
                padding: 16px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-container">
            <img src="media/nero_logo.png" alt="Nero Logo" class="logo">
            <span class="logo-separator">×</span>
            <img src="media/Andorra Logo_new.png" alt="Andorra Village Logo" class="logo">
        </div>

        <div class="question-box">
            <div class="question-title">
                How Was Your Experience?
            </div>
            <div class="options-container">
                <div class="option-box" data-option="yes">
                    <img src="media/happy_face.jpg" alt="Yes">
                </div>
                <div class="option-box" data-option="no">
                    <img src="media/sad_face.jpg" alt="No">
                </div>
            </div>
        </div>

        <div class="feedback-section">
            <div class="optional-label">Optional</div>
            <form id="feedbackForm" action="https://formsubmit.co/info@usenero.com" method="POST">
                <input type="hidden" name="_subject" value="New Feedback from Nero x Andorra">
                <input type="hidden" name="_captcha" value="false">
                <input type="hidden" name="_template" value="box">
                <input type="hidden" name="_next" value="https://ahmedalqurashi.github.io/nero-feedback/?success=true">
                <input type="hidden" name="robot_response" id="robotResponse" value="">
                <div class="form-group">
                    <textarea 
                        id="feedback" 
                        name="message" 
                        placeholder="Share your thoughts..."
                        maxlength="1000"
                    ></textarea>
                    <div class="char-count">
                        <span id="charCount">0</span> / 1000
                    </div>
                </div>
                
                <button type="submit" class="button" id="submitBtn" disabled>
                    Send Feedback
                </button>
            </form>

            <div class="success-message" id="successMessage">
                ✓ Thank you! Your feedback has been sent.
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('feedbackForm');
        const textarea = document.getElementById('feedback');
        const charCount = document.getElementById('charCount');
        const submitBtn = document.getElementById('submitBtn');
        const successMessage = document.getElementById('successMessage');


        // Check if redirected back with success
        if (window.location.search.includes('success=true')) {
            successMessage.classList.add('show');
            // Remove the URL parameter
            window.history.replaceState({}, document.title, window.location.pathname);
            // Hide success message after 5 seconds
            setTimeout(() => {
                successMessage.classList.remove('show');
            }, 5000);
        }

        // Form submission
        form.addEventListener('submit', function(e) {
            // Let the form submit naturally to FormSubmit
            submitBtn.disabled = true;
            submitBtn.textContent = 'Sending...';
        });

        // Option box selection
        const optionBoxes = document.querySelectorAll('.option-box');
        const robotResponse = document.getElementById('robotResponse');
        const optionalLabel = document.querySelector('.optional-label');
        let selectedOption = null;
        
        optionBoxes.forEach(box => {
            box.addEventListener('click', function() {
                // Remove selected class from all boxes
                optionBoxes.forEach(b => b.classList.remove('selected'));
                // Add selected class to clicked box
                this.classList.add('selected');
                // Store the selected option
                selectedOption = this.dataset.option;
                robotResponse.value = selectedOption;
                
                if (selectedOption === 'no') {
                    // Sad face: hide optional, require feedback
                    optionalLabel.style.display = 'none';
                    submitBtn.disabled = textarea.value.trim().length === 0;
                } else {
                    // Happy face: show optional, enable button
                    optionalLabel.style.display = 'inline-block';
                    submitBtn.disabled = false;
                }
            });
        });

        // Update button state when typing (for sad face selection)
        textarea.addEventListener('input', function() {
            charCount.textContent = this.value.length;
            if (selectedOption === 'no') {
                submitBtn.disabled = this.value.trim().length === 0;
            }
        });
    </script>
</body>
</html>
